# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # Disabled: this is an app, not a published library; API docs are not required.
    public_member_api_docs: false
    # Disabled: 80-char line limit is impractical for Flutter widget trees with
    # deep nesting and long string literals in seed data.
    lines_longer_than_80_chars: false
    # Disabled: comment_references flags references to private types in doc
    # comments; these are intentional internal cross-references in an app.
    comment_references: false
    # Disabled: avoid_equals_and_hash_code_on_mutable_classes is flagged on
    # DrillSegment which intentionally implements value equality for set/map use.
    avoid_equals_and_hash_code_on_mutable_classes: false
    # Disabled: one_member_abstracts is flagged on CrashReportService which is
    # an intentional single-method service interface for dependency injection.
    one_member_abstracts: false
    # Disabled: avoid_positional_boolean_parameters conflicts with Flutter's
    # standard onChanged callback pattern (e.g. Switch.onChanged: (bool) => ...).
    avoid_positional_boolean_parameters: false
    # Null-aware collection element syntax (?x) is a Dart 3.8+ feature not yet
    # available in the SDK pinned by this project's flutter_lints version.
    use_null_aware_elements: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
