name: iOS — Build Unsigned IPA (Sideloadly)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "iPhone 16" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 16" -b

      - name: Run integration tests
        run: flutter test integration_test/app_test.dart -d "iPhone 16"

      - name: Build unsigned iOS app
        run: flutter build ios --no-codesign --release

      - name: Package as IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r hermit-prov.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermit-prov-unsigned
          path: build/ios/ipa/hermit-prov.ipa
          retention-days: 7
